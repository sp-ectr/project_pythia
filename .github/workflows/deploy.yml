# .github/workflows/deploy.yml

name: Deploy Pythia Frontend and Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ЭТАП 1: Быстрая сборка React фронтенда с кэшем
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build
        run: |
          cd frontend
          npm ci
          npm run build

      # ЭТАП 2.1 Настройка SSH для доступа к VPS
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # ЭТАП 2.2 Копирование React build на VPS
      - name: Deploy Frontend to VPS
        run: |
          rsync -rlgoDzvO --delete \
            frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/spectr/projects/pythia/frontend/

      # ЭТАП 3: Деплой файлов бэкенда (копируем корень без мусора)
      - name: Deploy Backend to VPS
        run: |
          rsync -rlgoDzvO --delete \
              --exclude="frontend/" \
              --exclude=".git/" \
              --exclude=".github/" \
              --exclude=".venv/" \
              --exclude="logs/" \
              --exclude="node_modules/" \
              --exclude=".env" \
              --exclude=".idea/" \
              --exclude=".vs/" \
              --exclude="project_pythia.egg-info/" \
              --exclude="docker-compose.local.yml" \
              ./ \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/spectr/projects/pythia/backend/

      # ЭТАП 4: Миграции БД и запуск нового бэкенда
      - name: Rebuild Backend and Run Migrations
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd /home/spectr/projects/pythia
          docker compose build pythia_api
          docker compose run --rm pythia_api alembic upgrade head
          docker compose up -d pythia_api
          chmod -R 755 /home/spectr/projects/pythia/frontend/
          EOF